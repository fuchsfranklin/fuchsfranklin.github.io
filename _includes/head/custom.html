{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for jQuery, this needs to be first so that it has a chance to load. -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
 <link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Custom "FF" monogram favicon set (generated by make_favicons.py); ?v= busts browser caches -->
<link rel="icon" href="{{ base_path }}/images/favicon.ico?v=ff1" sizes="any">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-16x16.png?v=ff1" sizes="16x16">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=ff1" sizes="32x32">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-96x96.png?v=ff1" sizes="96x96">
<link rel="icon" type="image/png" href="{{ base_path }}/images/android-chrome-192x192.png?v=ff1" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png?v=ff1">
<link rel="manifest" href="{{ base_path }}/images/manifest.json?v=ff1">
<meta name="msapplication-TileColor" content="#494e52">
<meta name="msapplication-TileImage" content="{{ base_path }}/images/mstile-144x144.png?v=ff1">
<meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml?v=ff1">
<meta name="theme-color" content="#f1f1f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e2a3a" media="(prefers-color-scheme: dark)">

<!-- end custom head snippets -->
